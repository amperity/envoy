version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

jobs:
  build:
    docker:
      - image: cimg/clojure:1.12-openjdk-21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-{{ checksum "project.clj" }}
            - v1-
      - run: lein deps
      - save_cache:
          paths:
            - ~/.m2
          key: v1-{{ checksum "project.clj" }}
      - run: lein check
      - run: lein test
      - run: lein coverage --codecov
      - store_artifacts:
          path: target/coverage
          destination: coverage
      - codecov/upload:
          files: target/coverage/codecov.json

workflows:
  build:
    jobs:
      - build
